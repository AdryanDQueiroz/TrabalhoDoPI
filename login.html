<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Camada Bruta</title>
</head>
<body>
        <!-- ================= VLibras ====================== -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    <!-- Adiciona Libras no site -->
    <script>
        new window.VLibras.Widget({
            rootPath: 'https://vlibras.gov.br/app',
            avatar: 'Hosana', // Define o avatar como Hosana
            position: 'R' // Coloca na direita
        });
    </script>

    <!-- ================= ALTO CONTRASTE ====================== -->
    <button class = 'btn_contraste' onclick="document.body.classList.toggle('alto-contraste')" >
      <i class="fa-solid fa-circle-half-stroke"></i> Contraste
    </button>
    
    <button class="seta-voltar" onclick="history.back()">
    <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div class="area-login">
      <section id="login" class="abrir-login">
        <form>
           <h1 class="font-orbitron">Login</h1>
            <div class="input-box">
                <label>Email</label>
                <input placeholder="voce@email.com" type="email">
            </div>
            <div class="input-box">
                <label>Senha</label>
                <input placeholder="Sua senha" type="password">
            </div>

            <button class="botao-entrar">ENTRAR</button>

            <div>
            <label>
                <input type="checkbox">
                Lembrar meus dados
            </label>
            </div>

            <div class="cadastro">
                <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
            </div>
            <div class="cadastro">
                <br>
                <a href="#">Esqueci minha senha</a>            
            </div>

        </form>
    </section>
</div>
</body>
</html>
