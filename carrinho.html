<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>Carrinho Camada Bruta</title>
</head>
<body>
    <h2>Meu carrinho</h2>
    <!--Produto 1-->
    <div class="card-carrinho">

        <!-- Produto 1 -->
        <div class="item-carrinho">
            <img src="imagens/Natsuki.jpg" alt="produto1">

            <div class="info-prod">
                <h3>Figure da Natsuki bonitinha</h3>
                <p class="cor-pro-p">quantidade: 1</p>
                <p class="preco-prod">R$50,00</p>
            </div>
        </div>

    <!--Produto 2-->
    <div class="item-carrinho">
            <img src="imagens/Itachi.jpg" alt="produto2">

            <div class="info-prod">
                <h3>Figure do Itachi ninja bolado</h3>
                <p class="cor-pro-p">quantidade: 1</p>
                <p class="preco-prod">R$129,99</p>
            </div>
        </div>

        <div class="total-carrinho">
            <h3>Total: R$ 179,99</h3>
            <button class="botao-finalizar">Finalizar compra</button>
        </div>

    </div>
    
    <a href="index.html" class="voltar-inicio">Voltar para o início</a>
</body>
</html>
