<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho Camada Bruta</title>
</head>
<body>

    <!-- ================= VLibras ====================== -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    <!-- Adiciona Libras no site -->
    <script>
        new window.VLibras.Widget({
            rootPath: 'https://vlibras.gov.br/app',
            avatar: 'Hosana', // Define o avatar como Hosana
            position: 'R' // Coloca na direita
        });
    </script>

    <!-- ================= ALTO CONTRASTE ====================== -->
    <button class = 'btn_contraste' onclick="document.body.classList.toggle('alto-contraste')" >
      <i class="fa-solid fa-circle-half-stroke"></i> Contraste
    </button>

    <button class="seta-voltar" onclick="history.back()">
    <i class="fa-solid fa-chevron-left"></i>
    </button>

    <h2 class="font-orbitron">Meu carrinho</h2>
<main class="container-carrinho">
    <!--Produto 1-->
    <section class="card-carrinho">

        <!-- Produto 1 -->
        <div class="item-carrinho">
            <img src="imagens/Natsuki.jpg" alt="produto1">

            <div class="info-prod">
                <h3>Figure da Natsuki</h3>
                <p class="cor-pro-p">quantidade: 1</p>
                <p class="preco-prod">R$49,99</p>
            </div>

            <div class="quantidade-prod">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>
            
            <button class="remover-prod" aria-label="Remover produto">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>

    <!--Produto 2-->
    <div class="item-carrinho">
            <img src="imagens/Itachi.jpg" alt="produto2">

            <div class="info-prod">
                <h3>Figure do Itachi</h3>
                <p class="cor-pro-p">quantidade: 1</p>
                <p class="preco-prod">R$129,99</p>
            </div>

            <div class="quantidade-prod">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>

            <button class="remover-prod" aria-label="Remover produto">
                <i class="fa-solid fa-trash"></i>
            </button>
    </div>

    <!--Produto 3-->
    <div class="item-carrinho">
            <img src="imagens/Ikki.webp" alt="produto3">

            <div class="info-prod">
                <h3>Figure do Ikki</h3>
                <p class="cor-pro-p">quantidade: 1</p>
                <p class="preco-prod">R$129,99</p>
            </div>

            <div class="quantidade-prod">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>
            
            <button class="remover-prod" aria-label="Remover produto">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>        
    </section>
        <aside class="total-carrinho">
            <h4 class="font-orbitron-menor">Resumo</h4>
            <h5>Total:</h6>
            <p class="preco-prod">R$ 309,97</p>
            <button class="botao-finalizar">Finalizar compra</button>
        </aside>
</main>
</body>
</html>
